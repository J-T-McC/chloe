# Test databases for development and integration tests (MongoDB: root/chloe on :37017).
#   CHLOE_IT=1 go test ./internal/...
services:
  mysql:
    image: mysql:8.4
    container_name: chloe-mysql
    environment:
      MYSQL_ROOT_PASSWORD: chloe
    ports: ["33306:3306"]
  postgres:
    image: postgres:17
    container_name: chloe-pg
    environment:
      POSTGRES_PASSWORD: chloe
    ports: ["55432:5432"]
  # SSH jump host: reaches the databases as mysql:3306 and postgres:5432.
  # User "tunnel", password "chloe", or the throwaway key in testdata/sshd.
  sshd:
    build: testdata/sshd
    container_name: chloe-sshd
    ports: ["2222:22"]
  redis:
    image: redis:7.4
    container_name: chloe-redis
    command: ["redis-server", "--requirepass", "chloe"]
    ports: ["63790:6379"]
  mongo:
    image: mongo:8.0
    container_name: chloe-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: chloe
    ports: ["37017:27017"]
